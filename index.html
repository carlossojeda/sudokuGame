<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SudokuGame</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <header class="header">
        <H1>Welcome to SudokuGame</H1>
    </header>

    <div class="startGame">
        <button class="startGame--btn" id="startGameBtn">Start a new game</button>
    </div>

    <main class="sudokuBoard">
        <div class="mainSquare">
            <div class="columns">
                <p>1</p>
                <p>2</p>
                <p>3</p>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
